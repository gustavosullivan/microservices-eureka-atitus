spring.application.name=config-service
server.port=8888

spring.cloud.config.server.git.uri=https://github.com/gustavosullivan/microservices-eureka-atitus.git
spring.cloud.config.server.git.search-paths=config-service/configs/{application}
spring.cloud.config.server.git.default-label=main

eureka.client.service-url.default-zone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.healthcheck.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,circuit-breakers,circuit-breaker-events
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Servidor centralizado de configuracoes
info.app.autor=Gustavo Barbosa Portela
eureka.instance.metadata-map.github.repo=gustavosullivan/microservices-eureka-atitus

management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
